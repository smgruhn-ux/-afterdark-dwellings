<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Afterdark Dwellings</title>
  </head>
  <body>
    <script>
      (function () {
        var isProjectPages = window.location.hostname.endsWith('github.io');
        var base = isProjectPages ? '/-afterdark-dwellings' : '';
        var path = window.location.pathname;
        if (base && path.indexOf(base) === 0) path = path.slice(base.length);
        var target = path + window.location.search + window.location.hash;
        sessionStorage.setItem('afterdarkRedirect', target || '/');
        window.location.replace(base + '/');
      }());
    </script>
  </body>
</html>
